<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Forma 83"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>Forma 83</title></head><body><div class="app-shell"><header class="topbar"><div><div class="eyebrow">12 НЕДЕЛЬ · ТРАНСФОРМАЦИЯ</div><h1>Forma <span>83</span></h1></div><button class="icon-btn" id="settingsBtn">⚙︎</button></header><main><section class="hero card"><div><div class="muted">Текущий вес</div><div class="weight" id="weightValue">96,0 <small>кг</small></div><div class="target">Цель <b>83,0 кг</b></div></div><div class="ring" id="weightRing"><div><b id="lossValue">0,0</b><span>кг</span></div></div></section><section class="status card"><div class="section-head"><h2>Сегодня</h2><span id="dateLabel"></span></div><div class="metrics"><div class="metric steps-metric"><span class="metric-icon">🚶</span><b id="stepsValue">0</b><small>/ 10 000 шагов</small><div class="progress"><i id="stepsBar"></i></div><button class="edit-metric" id="editStepsBtn">Изменить</button></div><div class="metric"><span class="metric-icon">🚬</span><b id="smokesValue">0</b><small>сигарет сегодня</small><div class="stepper"><button data-action="smoke-minus">−</button><button data-action="smoke-plus">+</button></div></div></div></section><section class="card"><div class="section-head"><h2>План на сегодня</h2><span class="pill" id="dayType">ВОССТАНОВЛЕНИЕ</span></div><div id="tasks" class="tasks"></div></section><section class="card next-workout"><div class="section-head"><h2>Следующая тренировка</h2></div><div class="workout-preview"><div class="workout-icon">🏋️</div><div><b id
